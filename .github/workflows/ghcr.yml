name: GHCR

# PR and push: the tests (pytest against Postgres) run first.
# PR: build the image, boot it against Postgres and probe HTTP (no push).
# backend push: ghcr.io/skylab-kulubu/ytuguessr-backend:latest + :<sha>; when the tests and the probe pass,
#   also :production and the Dokploy deploy hook (production goes live automatically).
#   Not automatic when the push changes the schema or the retention run (models/, core/schema.py,
#   core/database.py, retention/) since the commit production runs: the run stops before :production.
#   After a look: Actions -> GHCR -> Run workflow (branch backend) deploys it.
on:
  pull_request:
    branches: [backend]
  push:
    branches: [backend]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: production gets the pushes in order.
concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: game_db
          POSTGRES_USER: guessr
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guessr -d game_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # tests/conftest.py points the application at this Postgres.
      - run: python -m pytest -q

  # Decides whether this run goes live: deploy=true on a backend push without schema or retention changes
  # since the last production deploy, and on a manual run of backend.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$REF" != refs/heads/backend ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run of backend: deploying $SHA."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit production runs: the last successful deploy to the production environment;
          # before the first one, the backend-production branch (the last manual release).
          base=''
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" --jq '.[].id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              base=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)
              break
            fi
          done
          [ -n "$base" ] || base=$(git rev-parse origin/backend-production)
          echo "production runs $base"
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$SHA" -- models core/schema.py core/database.py retention)
          else
            changed="(unknown production commit $base)"
          fi
          if [ -z "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Schema or retention code changed since production ($base); not deployed automatically. After a look: Actions -> GHCR -> Run workflow (backend)."
          {
            echo "### Not deployed automatically: schema or retention code changed"
            echo
            echo "Production runs \`$base\`. Changed:"
            echo
            echo "$changed" | sed 's/^/- /'
            echo
            echo "After a look: Actions -> GHCR -> Run workflow (branch backend)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "deploy=false" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: game_db
          POSTGRES_USER: guessr
          POSTGRES_PASSWORD: ci-probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guessr -d game_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IMAGE: ghcr.io/skylab-kulubu/ytuguessr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ytuguessr-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot against Postgres and probe HTTP
        run: |
          cat > ci.env <<'EOF'
          POSTGRES_USER=guessr
          POSTGRES_PASSWORD=ci-probe
          POSTGRES_DB=game_db
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          ADMIN_SECRET=ci-probe
          JWT_SECRET=ci-probe
          LOCATION_COUNT=5
          QUESTION_DURATION=60
          ALPHA_COEFFICIENT=1
          BETA_COEFFICIENT=1
          LEADERBOARD_PAGE_SIZE=10
          DOMAIN=http://localhost:3000
          EOF
          # The app creates its tables on import, in every gunicorn worker. On an empty database the four
          # workers can race on CREATE TABLE, so create the schema once first (production's database
          # already has it).
          docker run --rm --network host --env-file ci.env ytuguessr-backend:ci python -c 'import main'
          docker run -d --name app --network host --env-file ci.env ytuguessr-backend:ci
          # Public and backed by the database: 200 means the app booted and reached Postgres.
          for _ in $(seq 1 60); do
            code=$(curl -s -o body.json -w '%{http_code}' http://localhost:8000/api/game/stats || true)
            if [ "$code" = 200 ] && grep -q '"total_locations"' body.json; then
              echo "GET /api/game/stats -> 200 $(cat body.json)"
              exit 0
            fi
            sleep 2
          done
          echo "GET /api/game/stats never returned 200 (last: $code)"
          docker logs app
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/backend'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the probed image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/backend'
        env:
          DEPLOY: ${{ needs.gate.outputs.deploy }}
          SHA: ${{ github.sha }}
        run: |
          tags="latest $SHA"
          if [ "$DEPLOY" = true ]; then
            tags="$tags production"
          fi
          for tag in $tags; do
            docker tag ytuguessr-backend:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  deploy:
    needs: [gate, image]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # The hook redeploys only the Guessr backend application in Dokploy (it pulls :production).
      - name: Notify Dokploy
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_HOOK is not set: :production was pushed but nothing was deployed."
            exit 1
          fi
          curl -fsS -o /dev/null -X POST "$HOOK"
      - name: Wait for the API
        run: |
          sleep 90
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 10 https://guessr-api.yildizskylab.com/api/game/stats | grep -q '"total_locations"'; then
              echo "guessr-api answers"
              exit 0
            fi
            sleep 6
          done
          echo "::error::guessr-api did not answer for 5 minutes after the deploy"
          exit 1
