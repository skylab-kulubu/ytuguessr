name: GHCR

# PR: build the image, boot it against Postgres and probe HTTP (no push).
# backend push: ghcr.io/skylab-kulubu/ytuguessr-backend:latest + :<sha> (no deploy).
# backend-production push: :production + :<sha>, then the Dokploy deploy hook (if set).
on:
  pull_request:
    branches: [backend, backend-production]
  push:
    branches: [backend, backend-production]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: game_db
          POSTGRES_USER: guessr
          POSTGRES_PASSWORD: ci-probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guessr -d game_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IMAGE: ghcr.io/skylab-kulubu/ytuguessr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ytuguessr-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot against Postgres and probe HTTP
        run: |
          cat > ci.env <<'EOF'
          POSTGRES_USER=guessr
          POSTGRES_PASSWORD=ci-probe
          POSTGRES_DB=game_db
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          ADMIN_SECRET=ci-probe
          JWT_SECRET=ci-probe
          LOCATION_COUNT=5
          QUESTION_DURATION=60
          ALPHA_COEFFICIENT=1
          BETA_COEFFICIENT=1
          LEADERBOARD_PAGE_SIZE=10
          DOMAIN=http://localhost:3000
          EOF
          # The app creates its tables on import, in every gunicorn worker. On an empty database the four
          # workers can race on CREATE TABLE, so create the schema once first (production's database
          # already has it).
          docker run --rm --network host --env-file ci.env ytuguessr-backend:ci python -c 'import main'
          docker run -d --name app --network host --env-file ci.env ytuguessr-backend:ci
          # Public and backed by the database: 200 means the app booted and reached Postgres.
          for _ in $(seq 1 60); do
            code=$(curl -s -o body.json -w '%{http_code}' http://localhost:8000/api/game/stats || true)
            if [ "$code" = 200 ] && grep -q '"total_locations"' body.json; then
              echo "GET /api/game/stats -> 200 $(cat body.json)"
              exit 0
            fi
            sleep 2
          done
          echo "GET /api/game/stats never returned 200 (last: $code)"
          docker logs app
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the probed image to GHCR
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_NAME" = backend-production ]; then
            tags="production $SHA"
          else
            tags="latest $SHA"
          fi
          for tag in $tags; do
            docker tag ytuguessr-backend:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
      - name: Notify Dokploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/backend-production'
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_DEPLOY_HOOK unset; skip"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
